version: 2
updates:
  - package-ecosystem: npm
    directory: /website
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    # Astro's checker currently supports TypeScript 5/6, not 7.
    ignore:
      - dependency-name: typescript
        versions: [">=7.0.0"]
    groups:
      website:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
