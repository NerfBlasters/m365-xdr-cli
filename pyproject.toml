[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xdr-cli"
version = "0.9.0"
description = "Microsoft 365 Defender XDR investigation CLI — for humans and AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    # Pinned to 0.24.x: main.py._install_leaf_hook walks Typer's *internal*
    # registry attributes (registered_commands, registered_groups,
    # CommandInfo.callback). Re-verify with test_chain_capture_smoke before
    # bumping the minor version.
    "typer>=0.24.0,<0.25.0",
    "httpx>=0.28.0",
    "msal[broker]>=1.35.0",
    "tenacity>=9.0.0",
    "tomli-w>=1.2.0",
    "filelock>=3.12",
    "pytimeparse2>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0.0",
    "respx>=0.22.0",
    "ruff>=0.11.0",
]

[dependency-groups]
build = ["build==1.6.1", "setuptools>=75.0", "twine==7.0.0"]

[project.scripts]
xdr = "xdr_cli.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xdr_cli = [
    "queries/*.kql",
    "lists_seed/*.txt",
    "schema_graph/data/*.json",
    "schema_graph/data/*.jsonl",
    "schema_graph/data/profiles/*.jsonl",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "I001"]
"src/xdr_cli/commands/**" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
